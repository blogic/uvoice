#
# United Kingdom. Derived from BT SIN 350 (network tones), SIN 351 (analog
# line interface) and SIN 227 (Caller Display). SIN 350 publishes a permitted
# received level range at the network termination, not a send level, so the
# levels below follow the ITU-T E.180 send reference of -10 dBm0 and split it
# across the frequencies of a multi-tone signal.

[region]
iso3 = GBR
describe = United Kingdom

# SIN 350: dial tone 350 + 440 Hz present simultaneously, continuous.
[tone dial]
freq = 350 440
level = -13 -13
cadence = on
repeat = forever

# 3WC short stutter dial tone: the plain dial tone. The United Kingdom row of
# ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180, lists no
# recall dial tone.
[tone short_stutter_dial]
freq = 350 440
level = -13 -13
cadence = on
repeat = forever

# SIN 350 message-waiting dial tone. The published signal interrupts 350 Hz at
# 750/750 ms while 440 Hz runs continuously. The first segment plays the pair,
# and the second plays 440 Hz alone.
[tone stutter]
segment = 350+440 -13 750
segment = 440 -13 750
silence = 0
repeat = forever

# SIN 350 publishes no separate recall dial tone; the dial tone is reused.
[tone second_dial]
freq = 350 440
level = -13 -13
cadence = on
repeat = forever

# SIN 350 ringing tone 400 + 450 Hz, the double ring 400/200/400/2000 ms.
[tone ringback]
freq = 400 450
level = -13 -13
cadence = 400 200 400 2000
repeat = forever

# SIN 350 busy tone 400 Hz at 375/375 ms.
[tone busy]
freq = 400
level = -10
cadence = 375 375
repeat = forever

# SIN 350 equipment engaged (congestion) 400 Hz, 400/350/225/525 ms.
[tone reorder]
freq = 400
level = -10
cadence = 400 350 225 525
repeat = forever

# SIN 350 special information tone, 950/1400/1800 Hz +-50 Hz, 330 ms +-70 ms
# per segment with gaps of 30 ms or less.
[tone sit]
segment = 950 -10 330
segment = 1400 -10 330
segment = 1800 -10 330
silence = 1000
repeat = forever

# ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180, United
# Kingdom row: number unobtainable 400 Hz, continuous.
[tone number_unobtainable]
freq = 400
level = -10
cadence = on
repeat = forever

# SIN 350 call waiting: a 100 ms 400 Hz burst. The break and the presentation
# count are set by project decision: 4 s of silence, two presentations, then
# the alert ends. The engine bounds the tone at
# sum(cadence) x repeat: (100 + 4000) x 2 = 8200 ms.
[tone call_waiting]
freq = 400
level = -10
cadence = 100 4000
repeat = 2

# SIN 350 confirmation tone: 1400 Hz for 20 s, played once.
[tone confirm]
freq = 1400
level = -10
cadence = 20000 0
repeat = 1

# SIN 350 howler: the level rises from -8 dBm to +15 dBm over about 12 s and
# the signal runs for 3 minutes. SIN 350 calls it "multi-audio frequency" and
# publishes no frequency at all, so 1400 Hz is an engineering placeholder and
# only the rising level is faithful. No test on a live exchange confirms the
# frequency.
[tone howler]
segment = 1400 -20 3000
segment = 1400 -14 3000
segment = 1400 -8 3000
segment = 1400 -2 3000
silence = 0
repeat = forever

# SIN 351 power ringing: the double ring, 25 Hz.
[ring r1]
cadence = 400 200 400 2000

# Distinctive ring templates r2 to r8 carry the provisioned GB patterns
# (distinctRingPattern0..6). The Alert-Info token Bellcore-dr<n> selects
# r<n+1>, so dr1 is the normal ring. The GB pattern table counts from 0:
# pattern 0 is the normal ring, and patterns 1 to 3 are the Bellcore dr2 to
# dr4 shapes. No in-library consumer reads the rows; they exist for the
# region read-back.
[ring r2]
cadence = 400 200 400 2000

[ring r3]
cadence = 800 400 800 4000

[ring r4]
cadence = 400 200 400 200 800 4000

[ring r5]
cadence = 300 200 1000 200 300 4000

[ring r6]
cadence = 400 200 400 2000

[ring r7]
cadence = 400 200 400 2000

[ring r8]
cadence = 400 200 400 2000

# SIN 227 idle-state Caller Display: line reversal, then the dual tone alert
# signal, then the V.23 data burst. All three run before the first ring. The
# caller places the record: an FSK format after the first ring cycle, an
# alerting format before the first ring.
# SIN 227 allows a channel seizure of 96 to 315 bits and a mark of 55 bits or
# more. wait_ms is the gap between the alert and the burst. This file takes no
# SIN 227 value for it; 100 ms sits inside the ETSI range for the same gap.
# ack_timeout_ms: SIN 227 requires the terminal acknowledgment within 100 ms
# of the alert ending, and 150 ms adds the detector's own decision window.
[cid]
format = etsi-lr-dtas
wait_ms = 100
ack_timeout_ms = 150
seizure_bits = 300
mark_bits = 80
lr_pause_ms = 250
dtas_ms = 100

# The flash and release windows carry the provisioned GB values, the windows
# deployed units run. SIN 351 publishes a 53 to 103 ms timed break recall and
# a clear above 3 s on hook; the provisioned window 35..145 ms covers that
# recall range with margin and clears at 590 ms. Loop disconnect dialing runs
# at 10 +-1 pulses per second with a 67 percent break, so its break window
# overlaps the recall window. The two are mutually exclusive per line, and
# pulse_enable off makes recall the live feature on this profile.
[hook]
pulse_enable = off
debounce_ms = 10
flash_min_ms = 35
flash_max_ms = 145
release_min_ms = 590
pulse_break_min_ms = 55
pulse_break_max_ms = 85
pulse_make_max_ms = 50
pulse_interdigit_ms = 240
# The provisioned value (flash_service_mode 2).
# No in-library consumer reads it; it exists for the region read-back.
flash_service = drop
