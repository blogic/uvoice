#
# Serbia. Serbia has no public analog interface specification. It
# has no chapter in ETSI EN 300 001 V1.5.1 and RATEL publishes no interface
# document. The only primary source is the "Yugoslavia (Federal Republic of)"
# row of ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180
# (OB 781), which predates the Serbian state. Only dial, ringback, busy and the
# special information tone come from that row. Everything else falls back to the
# generic ETSI profile in ETS.conf and is marked below. No test on a live
# Telekom Srbija line confirms the values of this file.

[region]
iso3 = SRB
describe = Serbia

# OB 781, Yugoslavia row: the dial tone is 425 Hz, 0.7 s on, 0.8 s off, 0.2 s
# on, 0.3 s off. The row lists no continuous dial tone.
[tone dial]
freq = 425
level = -10
cadence = 700 800 200 300
repeat = forever

# 3WC short stutter dial tone. The row lists no recall dial tone, so this tone
# is the dial tone of the row.
[tone short_stutter_dial]
freq = 425
level = -10
cadence = 700 800 200 300
repeat = forever

# Not published. ETSI fallback, ES 201 970 special dial tone: 425 Hz, 500 ms
# on, 50 ms off.
[tone stutter]
freq = 425
level = -10
cadence = 500 50
repeat = forever

# Not published. The dial tone of the row.
[tone second_dial]
freq = 425
level = -10
cadence = 700 800 200 300
repeat = forever

# ITU-T E.180 annex, Yugoslavia row, ringing tone variant II: 425 Hz, 1 s on,
# 4 s off.
[tone ringback]
freq = 425
level = -10
cadence = 1000 4000
repeat = forever

# ITU-T E.180 annex, Yugoslavia row, busy tone variant I: 425 Hz, 500/500 ms.
[tone busy]
freq = 425
level = -10
cadence = 500 500
repeat = forever

# Not published. ETSI fallback, ES 201 970 congestion tone.
[tone reorder]
freq = 425
level = -10
cadence = 250 250
repeat = forever

# ITU-T E.180 annex, Yugoslavia row: 950/1400/1800 Hz, 333 ms per segment,
# 1 s pause.
[tone sit]
segment = 950 -10 333
segment = 1400 -10 333
segment = 1800 -10 333
silence = 1000
repeat = forever

# ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180: the
# Yugoslavia row lists no number-unobtainable tone. Page 29 of OB 781 defines
# the special information tone for a called number that "cannot be reached
# for reasons other than 'subscriber busy' or 'congestion'". This section
# therefore plays the special information tone above.
[tone number_unobtainable]
segment = 950 -10 333
segment = 1400 -10 333
segment = 1800 -10 333
silence = 1000
repeat = forever

# Call waiting: a 300 ms 425 Hz burst then 9.7 s of silence, seven
# presentations, by project decision. The engine bounds the tone at
# sum(cadence) x repeat: 10000 x 7 = 70000 ms.
[tone call_waiting]
freq = 425
level = -10
cadence = 300 9700
repeat = 7

# Not published. ETSI fallback shape; engineering choice.
[tone confirm]
freq = 425
level = -10
cadence = 100 100
repeat = 3

# Not published. Rising 425 Hz alert on the GR-506-CORE concept; engineering
# choice, not a cited value.
[tone howler]
segment = 425 -20 3000
segment = 425 -14 3000
segment = 425 -8 3000
segment = 425 -2 3000
silence = 0
repeat = forever

# Not published. The ringing tone variant II cadence implies 1 s on, 4 s off.
[ring r1]
cadence = 1000 4000

# Distinctive ring templates r2 to r8 carry the provisioned patterns
# (distinctRingPattern1..7). No in-library consumer reads them; they exist
# for the region read-back.
[ring r2]
cadence = 1000 4000

[ring r3]
cadence = 800 400 800 4000

[ring r4]
cadence = 400 200 400 200 800 4000

[ring r5]
cadence = 300 200 1000 200 300 4000

[ring r6]
cadence = 1000 4000

[ring r7]
cadence = 1000 4000

[ring r8]
cadence = 1000 4000

# Telekom Srbija offers caller identity but publishes no variant. The
# provisioned transports are dtmf-dtas for caller identity and etsi-dtas for
# the VMWI burst, the formats deployed units run. The timings stay the ETSI
# fallback: EN 300 659-1 bit counts and the EN 300 659-2 T14 acknowledgment
# wait.
[cid]
format = dtmf-dtas
mwi_format = etsi-dtas
wait_ms = 500
ack_timeout_ms = 165
seizure_bits = 300
mark_bits = 180

# The flash and release windows carry the provisioned RS values, the windows
# deployed units run; the pulse windows stay the ETSI fallback, identical to
# ETS.conf. The break window overlaps the recall window, so the two are
# mutually exclusive per line. pulse_enable off makes recall the live feature.
[hook]
pulse_enable = off
debounce_ms = 10
flash_min_ms = 35
flash_max_ms = 145
release_min_ms = 490
pulse_break_min_ms = 42
pulse_break_max_ms = 94
pulse_make_max_ms = 85
pulse_interdigit_ms = 240
# The provisioned value (flash_service_mode 2).
# No in-library consumer reads it; it exists for the region read-back.
flash_service = drop
