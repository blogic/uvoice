#
# Generic ETSI profile, the European default for a country with no file of its
# own. Derived from ETSI ES 201 970 clause 13.3 (identical to EG 201 188
# clause 13.3), EN 300 659-1 and -2 (CLIP), ES 201 729 (terminal register
# recall), ES 201 187 (terminal pulse dialing) and ITU-T E.180.
# ES 201 970 gives the tone level as -18 dBV at the network termination;
# ITU-T E.180 gives -10 dBm0 at the network interface, which is the send
# reference used here.

[region]
iso3 = ETS
describe = ETSI European default

# ES 201 970 13.3: dial tone 425 Hz, continuous.
[tone dial]
freq = 425
level = -10
cadence = on
repeat = forever

# 3WC short stutter dial tone. Region default is the plain dial tone; this
# file defines no US-style three-burst stutter.
[tone short_stutter_dial]
freq = 425
level = -10
cadence = on
repeat = forever

# ES 201 970 13.3: special dial tone 425 Hz, 500 ms on, 50 ms off.
[tone stutter]
freq = 425
level = -10
cadence = 500 50
repeat = forever

# ETSI harmonizes no second dial tone; the dial tone is reused.
[tone second_dial]
freq = 425
level = -10
cadence = on
repeat = forever

# ES 201 970 13.3: ringing tone 425 Hz, 1 s on, 4 s off.
[tone ringback]
freq = 425
level = -10
cadence = 1000 4000
repeat = forever

# ES 201 970 13.3: busy tone 425 Hz, 500/500 ms.
[tone busy]
freq = 425
level = -10
cadence = 500 500
repeat = forever

# ES 201 970 13.3: congestion tone 425 Hz, 250/250 ms.
[tone reorder]
freq = 425
level = -10
cadence = 250 250
repeat = forever

# ES 201 970 13.3: special information tone 950/1400/1800 Hz, 330 ms per
# segment, 1 s pause.
[tone sit]
segment = 950 -10 330
segment = 1400 -10 330
segment = 1800 -10 330
silence = 1000
repeat = forever

# ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180, has no
# ETSI row. Its page 29 defines the special information tone for a called
# number that "cannot be reached for reasons other than 'subscriber busy' or
# 'congestion'". This section therefore plays the special information tone
# above.
[tone number_unobtainable]
segment = 950 -10 330
segment = 1400 -10 330
segment = 1800 -10 330
silence = 1000
repeat = forever

# ES 201 970 13.3: call waiting 425 Hz, two 200 ms bursts split by 200 ms,
# then 9 s of silence, two presentations. The engine bounds the tone at
# sum(cadence) x repeat: 9600 x 2 = 19200 ms.
[tone call_waiting]
freq = 425
level = -10
cadence = 200 200 200 9000
repeat = 2

# ETSI harmonizes no confirmation tone. Three short 425 Hz bursts follow the
# shape of the harmonized release tone; engineering choice, not a cited value.
[tone confirm]
freq = 425
level = -10
cadence = 100 100
repeat = 3

# ETSI harmonizes no receiver-off-hook signal. A rising 425 Hz alert follows
# the GR-506-CORE concept; engineering choice, not a cited value.
[tone howler]
segment = 425 -20 3000
segment = 425 -14 3000
segment = 425 -8 3000
segment = 425 -2 3000
silence = 0
repeat = forever

# TR 101 183: 25 Hz ringing, 1 s on, 4 s off.
[ring r1]
cadence = 1000 4000

# Distinctive ring templates r2 to r8 carry the provisioned patterns
# (distinctRingPattern1..7). No in-library consumer reads them; they exist
# for the region read-back.
[ring r2]
cadence = 1000 4000

[ring r3]
cadence = 800 400 800 4000

[ring r4]
cadence = 400 200 400 200 800 4000

[ring r5]
cadence = 300 200 1000 200 300 4000

[ring r6]
cadence = 1000 4000

[ring r7]
cadence = 1000 4000

[ring r8]
cadence = 1000 4000

# The provisioned transport is etsi-dtas, the format deployed units run, so
# the alerting block follows the DT-AS shape of EN 300 659-1: the whole
# sequence runs before the first ring with a 100 ms gap between the alert and
# the burst. The caller places the record: an FSK format after the first ring
# cycle, an alerting format before the first ring. The framing is V.23 with a
# 300 bit channel seizure and a 180 +-25 bit mark.
# ack_timeout_ms is the EN 300 659-2 T14 network wait for the terminal DTMF
# "D", 160 +-5 ms.
[cid]
format = etsi-dtas
wait_ms = 100
ack_timeout_ms = 165
seizure_bits = 300
mark_bits = 180

# The flash and release windows carry the provisioned EU values, the windows
# deployed units run. EG 201 188 / ES 201 729: the network accepts a register
# recall of 50 to 130 ms; the provisioned window 35..145 ms covers that range
# with margin. An on-hook period below 250 ms is never a clear and above
# 500 ms always is; the provisioned release clears at 490 ms, inside the band
# where a network may clear. ES 201 187 pulse dialing is accepted at 8 to 12
# pulses per second with a 50 to 75 percent break, which is 42 to 94 ms of
# break. That window overlaps the recall window, so the two are mutually
# exclusive per line. pulse_enable off makes recall the live feature.
[hook]
pulse_enable = off
debounce_ms = 10
flash_min_ms = 35
flash_max_ms = 145
release_min_ms = 490
pulse_break_min_ms = 42
pulse_break_max_ms = 94
pulse_make_max_ms = 85
pulse_interdigit_ms = 240
# The provisioned value (flash_service_mode 2).
# No in-library consumer reads it; it exists for the region read-back.
flash_service = drop
