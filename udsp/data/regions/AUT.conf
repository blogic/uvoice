# Austria. Derived from the A1 Telekom Austria Netzabschlussbedingungen for the
# analog interface (edition 08/2010) and ETSI EN 300 001 V1.5.1 chapter AT.
# A1 sets every audible tone at -10 dBm0 and call waiting at -3 dBm0. The
# digital network uses 420 Hz; the older analog network uses 450 Hz.

[region]
iso3 = AUT
describe = Austria

[tone dial]
freq = 420
level = -10
cadence = on
repeat = forever

# 3WC short stutter dial tone: the recall dial tone of the Austria row of ITU
# Operational Bulletin No. 781 (1 February 2003), annex to E.180 (OB 781),
# 420 Hz, continuous.
[tone short_stutter_dial]
freq = 420
level = -10
cadence = on
repeat = forever

# A1 message-waiting dial tone alternates 420 Hz with the 380 + 420 Hz pair at
# 1 s intervals. 420 Hz alone plays at the A1 -10 dBm0, and each frequency of
# the pair at -13 dBm0, so the pair sums to -10 dBm0.
[tone stutter]
segment = 420 -10 1000
segment = 380+420 -13 1000
silence = 0
repeat = forever

# EN 300 001 chapter AT lists the recall dial tone as the continuous 420 Hz.
[tone second_dial]
freq = 420
level = -10
cadence = on
repeat = forever

# A1 ringing tone 420 Hz, 1 s on, 5 s off, +-20 percent.
[tone ringback]
freq = 420
level = -10
cadence = 1000 5000
repeat = forever

# A1 busy tone 420 Hz, 400/400 ms +-20 percent.
[tone busy]
freq = 420
level = -10
cadence = 400 400
repeat = forever

# A1 congestion tone 420 Hz, 200/200 ms +-20 percent.
[tone reorder]
freq = 420
level = -10
cadence = 200 200
repeat = forever

# A1 special information tone 950/1400/1800 Hz +-50 Hz, 330 ms +-70 ms per
# segment, 1 s pause +-20 percent.
[tone sit]
segment = 950 -10 330
segment = 1400 -10 330
segment = 1800 -10 330
silence = 1000
repeat = forever

# ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180, Austria
# row: number unobtainable is the 950/1400/1800 Hz triple, three segments of
# 0.33 s, then 1.0 s off. It plays the segments of the special information
# tone above.
[tone number_unobtainable]
segment = 950 -10 330
segment = 1400 -10 330
segment = 1800 -10 330
silence = 1000
repeat = forever

# Call waiting: two 200 ms bursts at 425 Hz split by 200 ms, then 9 s of
# silence, two presentations, by project decision. The A1 text lists a 40 ms
# 420 Hz burst every 1950 ms at -3 dBm0. OB 781 lists the A1 waiting tone,
# 420 Hz, 0.04 s on, 1.95 s off. The -3 dBm0 offsets that short burst, so the
# 200 ms bursts play at -10 dBm0, as the same burst shape in ETS.conf does.
# 425 Hz differs from the 420 Hz of the other tones of this file. The engine
# bounds the tone at sum(cadence) x repeat: 9600 x 2 = 19200 ms.
[tone call_waiting]
freq = 425
level = -10
cadence = 200 200 200 9000
repeat = 2

# A1 positive acknowledgment tone, 380 + 420 Hz at 1 s on, 5 s off.
[tone confirm]
freq = 380 420
level = -13 -13
cadence = 1000 5000
repeat = forever

# A1 publishes no receiver-off-hook signal. A rising 420 Hz alert follows the
# GR-506-CORE concept; engineering choice, not a cited value.
[tone howler]
segment = 420 -20 3000
segment = 420 -14 3000
segment = 420 -8 3000
segment = 420 -2 3000
silence = 0
repeat = forever

# A1 power ringing: 50 +-5 Hz, 1 s on, 5 s off. r1 keeps the A1 cited 5 s
# off; the provisioned pattern0 uses 4 s.
[ring r1]
cadence = 1000 5000

# Distinctive ring templates r2 to r8 carry the provisioned patterns
# (distinctRingPattern1..7). No in-library consumer reads them; they exist
# for the region read-back.
[ring r2]
cadence = 1000 4000

[ring r3]
cadence = 800 400 800 4000

[ring r4]
cadence = 400 200 400 200 800 4000

[ring r5]
cadence = 300 200 1000 200 300 4000

[ring r6]
cadence = 1000 4000

[ring r7]
cadence = 1000 4000

[ring r8]
cadence = 1000 4000

# The provisioned transport is etsi-dtas, the format deployed units run, so
# the alerting block follows the DT-AS shape of EN 300 659-1: the whole
# sequence runs before the first ring with a 100 ms gap between the alert and
# the burst. The caller places the record: an FSK format after the first ring
# cycle, an alerting format before the first ring. The A1 text itself lists
# V.23 FSK during ringing with no DT-AS; the provisioned value diverges from
# A1 and wins here. EN 300 659-1 narrows the framing to a 300 bit channel
# seizure and a 180 bit mark. A1 does not offer type 2 (call waiting) caller
# identity at all, so ack_timeout_ms carries the EN 300 659-2 T14 value for
# completeness.
[cid]
format = etsi-dtas
wait_ms = 100
ack_timeout_ms = 165
seizure_bits = 300
mark_bits = 180

# The flash and release windows carry the provisioned AT values, the windows
# deployed units run. A1 accepts a register recall of 50 to 120 ms (35 ms for
# electronic sets) and must reject anything below 10 ms or above 250 ms; the
# provisioned window 35..145 ms covers the A1 range and clears at 490 ms where
# A1 names 250 ms. Pulse dialing is 10 +-0.5 pulses per second with a
# 60 +-3 ms break and a 40 +-2 ms make; the network accepts a 50 to 69 ms
# break. That window overlaps the recall window, so the two are mutually
# exclusive per line. pulse_enable off makes recall the live feature.
[hook]
pulse_enable = off
debounce_ms = 10
flash_min_ms = 35
flash_max_ms = 145
release_min_ms = 490
pulse_break_min_ms = 50
pulse_break_max_ms = 69
pulse_make_max_ms = 60
pulse_interdigit_ms = 240
# The provisioned value (flash_service_mode 2).
# No in-library consumer reads it; it exists for the region read-back.
flash_service = drop
