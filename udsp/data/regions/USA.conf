# United States. Derived from Telcordia GR-506-CORE (LSSGR: Signaling for
# Analog Interfaces) and GR-30-CORE (Voiceband Data Transmission Interface,
# the type 1 and type 2 caller identity signaling).

[region]
iso3 = USA
describe = United States

# GR-506-CORE precise tone plan: dial tone 350 + 440 Hz, continuous.
[tone dial]
freq = 350 440
level = -13 -13
cadence = on
repeat = forever

# Message-waiting stutter: the precise dial tone pair interrupted at 10 Hz for
# about a second, then the steady dial tone. The burst count is an
# approximation; the interruption rate and the steady tail are not.
[tone stutter]
freq = 350 440
level = -13 -13
cadence = 100 100
repeat = 10
then = on

# Recall (second) dial tone: three 100/100 ms bursts of the dial tone pair,
# then continuous. ITU Operational Bulletin No. 781 (1 February 2003), annex
# to E.180 (OB 781), United States row.
[tone second_dial]
freq = 350 440
level = -13 -13
cadence = 100 100
repeat = 3
then = on

# GR-506-CORE audible ringing 440 + 480 Hz, 2 s on, 4 s off.
[tone ringback]
freq = 440 480
level = -19 -19
cadence = 2000 4000
repeat = forever

# GR-506-CORE line busy 480 + 620 Hz at 60 interruptions per minute.
[tone busy]
freq = 480 620
level = -24 -24
cadence = 500 500
repeat = forever

# GR-506-CORE reorder, the same pair at 120 interruptions per minute. OB 781
# lists 0.3 s on, 0.2 s off; the file keeps the GR-506-CORE 250/250 ms.
[tone reorder]
freq = 480 620
level = -24 -24
cadence = 250 250
repeat = forever

# GR-506-CORE special information tone, the low-tone triple. The published
# segment frequencies are 913.8, 1370.6 and 1776.7 Hz; the grammar carries
# whole hertz, so they are rounded. Short segments 276 ms, long segment 380 ms.
[tone sit]
segment = 914 -24 276
segment = 1371 -24 276
segment = 1777 -24 380
silence = 1000
repeat = forever

# Number unobtainable: a United States line plays the reorder tone for a
# number that the network cannot reach.
[tone number_unobtainable]
freq = 480 620
level = -24 -24
cadence = 250 250
repeat = forever

# GR-506-CORE call waiting: a 440 Hz burst of 300 ms, then 10 s of silence,
# two presentations, then the alert ends. It is also the SAS the type 2
# sequence plays before the CAS.
# The engine bounds the tone at sum(cadence) x repeat, trailing silence
# included: (300 + 10000) x 2 = 20600 ms.
[tone call_waiting]
freq = 440
level = -13
cadence = 300 10000
repeat = 2

# GR-506-CORE confirmation tone: three short bursts of the dial tone pair.
[tone confirm]
freq = 350 440
level = -13 -13
cadence = 100 100
repeat = 3

# GR-506-CORE receiver off hook (ROH) alerting tone, four frequencies at
# 10 Hz interruption. The per-frequency level is set 12 dB below the
# reference so the four-tone sum stays inside full scale.
[tone howler]
freq = 1400 2060 2450 2600
level = -12 -12 -12 -12
cadence = 100 100
repeat = forever

# 3WC short stutter dial tone: three short bursts of the dial tone pair, then
# the steady dial tone so the subscriber can dial the third party. The daemon
# plays this after the hookflash that starts adding a call.
[tone short_stutter_dial]
freq = 350 440
level = -13 -13
cadence = 100 100
repeat = 3
then = on

# GR-506-CORE power ringing: 2 s on, 4 s off.
[ring r1]
cadence = 2000 4000

# Distinctive ring templates r2 to r8 carry the provisioned patterns
# (distinctRingPattern1..7). No in-library consumer reads them; they exist
# for the region read-back.
[ring r2]
cadence = 2000 4000

[ring r3]
cadence = 800 400 800 4000

[ring r4]
cadence = 400 200 400 200 800 4000

[ring r5]
cadence = 300 200 1000 200 300 4000

[ring r6]
cadence = 2000 4000

[ring r7]
cadence = 2000 4000

[ring r8]
cadence = 2000 4000

# GR-506-CORE distinctive call-waiting tone patterns, the type 2 SAS variant a
# distinctive-ring id or a BroadWorks CallWaitingTone digit selects. c1
# repeats the plain 300 ms burst, c2 to c4 draw the short and long patterns.
# Every presentation sits inside the GR-30-CORE X window (300, 300, 500,
# 700 ms) and each trailing break clears the type 2 exchange, so the CAS
# follows the last burst.
[cw c1]
freq = 440
level = -13
cadence = 300 10000
repeat = 2

[cw c2]
freq = 440
level = -13
cadence = 100 100 100 10000
repeat = 2

[cw c3]
freq = 440
level = -13
cadence = 100 100 100 100 100 10000
repeat = 2

[cw c4]
freq = 440
level = -13
cadence = 100 100 300 100 100 10000
repeat = 2

# GR-30-CORE type 1 on-hook FSK after the first ring, Bell 202 with a 300 bit
# channel seizure (250 ms) and a 180 bit mark (150 ms); the burst starts at
# least 500 ms after the first ring ends. ack_timeout_ms bounds the type 2 CPE
# acknowledgment: the CPE starts its DTMF "D" or "A" within 100 ms of the CAS
# end and the digit itself lasts 55 to 65 ms, so 300 ms covers the response
# plus the detector's own decision window.
[cid]
format = bellcore-fsk
wait_ms = 500
ack_timeout_ms = 300
seizure_bits = 300
mark_bits = 180

# Loop disconnect dialing generates 10 pulses per second at 58 to 64 percent
# break. The accepted range is 8 to 11 pulses per second at 40 to 80 percent
# break, which is 33 to 100 ms of break and up to 85 ms of make.
[hook]
pulse_enable = on
debounce_ms = 10
flash_min_ms = 300
flash_max_ms = 1300
release_min_ms = 1301
pulse_break_min_ms = 33
pulse_break_max_ms = 100
pulse_make_max_ms = 85
pulse_interdigit_ms = 300
# The provisioned value (flash_service_mode 2).
# No in-library consumer reads it; it exists for the region read-back.
flash_service = drop
