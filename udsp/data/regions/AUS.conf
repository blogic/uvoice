#
# Australia. Derived from AS/CA S002:2010 (Analogue interworking and
# non-interference requirements for Customer Equipment) and its 2012
# amendment. S002 caps pre-answer tones at -13 dBm and call waiting at
# -13 dBm at the network boundary but publishes no per-tone dBm0, so a
# multi-frequency signal splits that cap across its frequencies.
#
# The published dial and ringing tones are 425 Hz amplitude modulated at 25 Hz
# with more than 90 percent depth. The grammar has no modulation field, so the
# equal-amplitude three-tone alternative S002 also allows (400 + 425 + 450 Hz)
# is used instead; it is the same signal to a first approximation.

[region]
iso3 = AUS
describe = Australia

[tone dial]
freq = 400 425 450
level = -18 -18 -18
cadence = on
repeat = forever

# 3WC short stutter dial tone: the plain dial tone. The Australia row of ITU
# Operational Bulletin No. 781 (1 February 2003), annex to E.180, lists no
# recall dial tone.
[tone short_stutter_dial]
freq = 400 425 450
level = -18 -18 -18
cadence = on
repeat = forever

# S002 special dial tone, 100 ms on, 40 ms off.
[tone stutter]
freq = 400 425 450
level = -18 -18 -18
cadence = 100 40
repeat = forever

# S002 publishes no separate recall dial tone; the dial tone is reused.
[tone second_dial]
freq = 400 425 450
level = -18 -18 -18
cadence = on
repeat = forever

# S002 ringing tone, the double ring 400/200/400/2000 ms on 400 + 450 Hz.
[tone ringback]
freq = 400 450
level = -16 -16
cadence = 400 200 400 2000
repeat = forever

# S002 busy tone 425 Hz +-10 Hz, 375/375 ms +-10 percent.
[tone busy]
freq = 425
level = -13
cadence = 375 375
repeat = forever

# S002 congestion tone: the busy cadence with every second burst 10 dB down.
# Each cycle is a 425 Hz burst at -13 dBm0, 375 ms off, a burst at -23 dBm0,
# and 375 ms of silence.
[tone reorder]
segment = 425 -13 375
segment = off 375
segment = 425 -23 375
silence = 375
repeat = forever

# S002 number unobtainable, 425 Hz at 2500/500 ms. Australia does not use the
# 950/1400/1800 Hz segment triple, so the sit slot carries that tone.
[tone sit]
freq = 425
level = -13
cadence = 2500 500
repeat = forever

# ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180,
# Australia row: number unobtainable 425 Hz, 2.5 s on, 0.5 s off. S002 gives
# the same tone.
[tone number_unobtainable]
freq = 425
level = -13
cadence = 2500 500
repeat = forever

# S002 call waiting 425 Hz, two 200 ms bursts split by 200 ms, then 4.4 s of
# silence, ten presentations. The engine bounds the tone at
# sum(cadence) x repeat, trailing silence included: 5000 x 10 = 50000 ms.
# That exceeds the S002 "up to 45 s" cap by one presentation.
[tone call_waiting]
freq = 425
level = -13
cadence = 200 200 200 4400
repeat = 10

# S002 facilities (confirmation) tone, 425 Hz continuous.
[tone confirm]
freq = 425
level = -13
cadence = on
repeat = forever

# S002 howler: a sweep from 1500 to 3200 Hz at a graduated level. The grammar
# has no sweep, so four rising segments approximate it.
[tone howler]
segment = 1500 -20 2000
segment = 2000 -14 2000
segment = 2600 -8 2000
segment = 3200 -2 2000
silence = 0
repeat = forever

# S002 power ringing: 25 Hz +-0.5 Hz, the double ring.
[ring r1]
cadence = 400 200 400 2000

# Distinctive ring templates r2 to r8 carry the provisioned AU patterns
# (distinctRingPattern0..6). The Alert-Info token Bellcore-dr<n> selects
# r<n+1>, so dr1 is the normal ring. This file reads the AU pattern table
# from 0, like the GB table, because its pattern 0 is the normal ring. No AU
# source states this reading. Pattern 7 (200 400 200 400 200 1600) has no
# template, and this file drops it. No in-library consumer reads the rows;
# they exist for the region read-back.
[ring r2]
cadence = 400 200 400 2000

[ring r3]
cadence = 400 400 200 200 400 1400

[ring r4]
cadence = 400 400 200 2000

[ring r5]
cadence = 200 200 400 2200

[ring r6]
cadence = 400 2600

[ring r7]
cadence = 400 400 200 400 200 1400

[ring r8]
cadence = 200 400 200 200 400 1600

# Australian CND is Bell 202 FSK after the first ring. AS/CA S002 publishes no
# Australia-specific bit counts, so the GR-30-CORE 300 bit seizure and 180 bit
# mark are used. No test on an Australian line confirms these counts.
# ack_timeout_ms carries the GR-30-CORE value: no Australian type 2 timing is
# published.
[cid]
format = bellcore-fsk
wait_ms = 500
ack_timeout_ms = 300
seizure_bits = 300
mark_bits = 180

# The flash and release windows carry the provisioned AU values, the windows
# deployed units run. S002 publishes register recall as 100 +-20 ms and
# carriers may need up to 800 ms of loop removal before a clear; the
# provisioned window 35..145 ms covers the recall range and clears at 290 ms.
# Pulse dialing is 10 pulses per second with a 60 to 70 ms break and a 30 to
# 40 ms make. The detection window is widened to 50 to 85 ms, which overlaps
# the recall window, so the two are mutually exclusive per line. pulse_enable
# off makes recall the live feature.
[hook]
pulse_enable = off
debounce_ms = 10
flash_min_ms = 35
flash_max_ms = 145
release_min_ms = 290
pulse_break_min_ms = 50
pulse_break_max_ms = 85
pulse_make_max_ms = 55
pulse_interdigit_ms = 750
# The provisioned value (flash_service_mode 2).
# No in-library consumer reads it; it exists for the region read-back.
flash_service = drop
