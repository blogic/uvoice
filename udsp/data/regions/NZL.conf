#
# New Zealand. Derived from Telepermit PTC 200 and Spark TNA 102, plus the TCF
# SIP ATA interoperability requirements and the New Zealand row of ITU
# Operational Bulletin No. 781 (1 February 2003), annex to E.180 (OB 781).
# Every single-frequency tone is 400 Hz.
# TNA 102 gives the generated level as -9 dBm0, which is the send level used
# here; a two-tone signal splits it across its frequencies.

[region]
iso3 = NZL
describe = New Zealand

[tone dial]
freq = 400
level = -9
cadence = on
repeat = forever

# 3WC short stutter dial tone: the OB 781 recall dial tone, three 100/100 ms
# bursts, then continuous.
[tone short_stutter_dial]
freq = 400
level = -9
cadence = 100 100
repeat = 3
then = on

# TNA 102 message-waiting dial tone: 100/100 ms for 2.5 s then continuous.
[tone stutter]
freq = 400
level = -9
cadence = 100 100
repeat = 12
then = on

# TNA 102 second dial tone: three 100/100 ms bursts then continuous.
[tone second_dial]
freq = 400
level = -9
cadence = 100 100
repeat = 3
then = on

# TNA 102 ringing tone 400 + 450 Hz, the double ring 400/200/400/2000 ms.
[tone ringback]
freq = 400 450
level = -12 -12
cadence = 400 200 400 2000
repeat = forever

# TNA 102 busy tone, 500/500 ms.
[tone busy]
freq = 400
level = -9
cadence = 500 500
repeat = forever

# TNA 102 disconnect (congestion) tone, 250/250 ms.
[tone reorder]
freq = 400
level = -9
cadence = 250 250
repeat = forever

# New Zealand does not use the 950/1400/1800 Hz segment triple, so the sit
# slot plays the number-unobtainable tone of the next section.
[tone sit]
freq = 400
level = -9
cadence = 750 100 750 100 750 100 750 400
repeat = forever

# ITU Operational Bulletin No. 781 (1 February 2003), annex to E.180, New
# Zealand row: number unobtainable 400 Hz, three cycles of 0.75 s on and 0.1 s
# off, then 0.75 s on and 0.4 s off.
[tone number_unobtainable]
freq = 400
level = -9
cadence = 750 100 750 100 750 100 750 400
repeat = forever

# TNA 102 call waiting: a 200 ms burst then 3 s of silence, four
# presentations. The engine bounds the tone at sum(cadence) x repeat:
# 3200 x 4 = 12800 ms. OB 781 lists it as call waiting tone I,
# 3 x (0.2 s on, 3.0 s off), then 0.2 s on. The file keeps
# a 3 s break after the last burst too. The type 2 lead is one cycle less its
# last break, so the OB 781 form as one cycle would delay the CAS by 9.8 s.
[tone call_waiting]
freq = 400
level = -9
cadence = 200 3000
repeat = 4

# TNA 102 switching-complete (confirmation) tone on 400 + 450 Hz.
[tone confirm]
freq = 400 450
level = -12 -12
cadence = 200 400 2000 400
repeat = 1

# Neither PTC 200 nor the TCF standard specifies a howler; the TCF text only
# says one "can be implemented". A rising 400 Hz alert follows the GR-506-CORE
# concept; engineering choice, not a cited value.
[tone howler]
segment = 400 -20 3000
segment = 400 -14 3000
segment = 400 -8 3000
segment = 400 -2 3000
silence = 0
repeat = forever

# PTC 200 power ringing: 25 +-1 Hz, the double ring. r1 keeps the PTC 200
# cited 200 ms gap; the provisioned pattern0 uses a 235 ms gap.
[ring r1]
cadence = 400 200 400 2000

# Distinctive ring templates r2 to r8 carry the provisioned patterns
# (distinctRingPattern1..7). No in-library consumer reads them; they exist
# for the region read-back.
[ring r2]
cadence = 400 235 400 2000

[ring r3]
cadence = 400 2600

[ring r4]
cadence = 400 235 400 235 400 1400

[ring r5]
cadence = 400 800 400 1400

[ring r6]
cadence = 400 200 400 2000

[ring r7]
cadence = 400 200 400 2000

[ring r8]
cadence = 400 200 400 2000

# OB 781 call waiting tones II and III, the type 2 SAS variants that a
# distinctive-ring id selects: c1 is 3 x (0.1 on, 0.1 off, 0.1 on, 3.0 off),
# and c2 adds a third 0.1 s burst. Each presentation (300 and 500 ms) sits
# inside the GR-30-CORE X window, and each 3 s break clears the type 2
# exchange.
[cw c1]
freq = 400
level = -9
cadence = 100 100 100 3000
repeat = 3

[cw c2]
freq = 400
level = -9
cadence = 100 100 100 100 100 3000
repeat = 3

# TNA 102 caller display is Bell 202 FSK after the first ring, 300 bit channel
# seizure and 180 bit mark at -13.5 +-1.5 dBm. No New Zealand type 2
# acknowledgment timing is published, so ack_timeout_ms carries the
# GR-30-CORE derived value.
[cid]
format = bellcore-fsk
wait_ms = 500
ack_timeout_ms = 300
seizure_bits = 300
mark_bits = 180

# The flash and release windows carry the provisioned NZ values, the windows
# deployed units run. PTC 200 register recall: customer equipment generates
# 300 to 800 ms (500 to 650 ms recommended) and the network responds from
# about 350 ms; the provisioned window 460..800 ms sits inside that range and
# clears at 960 ms. A loop current below 5 mA for more than 1 s is a clear.
# New Zealand decadic dialing inverts the digit coding: a dialed N sends
# 10 - N pulses. PTC 202, 211 and 212 are not public, so this profile uses
# the generic 10 pulse per second windows. pulse_invert states the inversion.
# The hook machine reports the pulse count with this coding, and the caller
# maps the count to the digit.
[hook]
pulse_enable = on
pulse_invert = on
debounce_ms = 10
flash_min_ms = 460
flash_max_ms = 800
release_min_ms = 960
pulse_break_min_ms = 40
pulse_break_max_ms = 100
pulse_make_max_ms = 60
pulse_interdigit_ms = 300
# The provisioned value (flash_service_mode 2).
# No in-library consumer reads it; it exists for the region read-back.
flash_service = drop
